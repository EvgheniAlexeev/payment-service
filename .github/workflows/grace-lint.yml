name: GRACE Checks

on:
  pull_request:
    branches:
      - main
      - develop
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'grace-tooling/**'
      - '.github/workflows/grace-lint.yml'
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'grace-tooling/**'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build --no-restore --verbosity minimal

      - name: dotnet test (unit)
        run: >
          dotnet test --no-build --verbosity minimal --logger "trx"
          --filter "FullyQualifiedName!~IntegrationTests"

      - name: dotnet test (integration — may require Docker)
        run: >
          dotnet test --no-build --verbosity minimal --logger "trx"
          --filter "FullyQualifiedName~IntegrationTests"
        continue-on-error: true

  lint:
    name: GRACE Lint & Doxygen Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: GRACE Phase-3 Lint
        id: lint
        run: |
          chmod +x grace-tooling/grace-lint-phase3.py
          python3 grace-tooling/grace-lint-phase3.py src --output json --json-path lint-report.json
          EXIT_CODE=$?
          echo "lint_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat lint-report.json
          exit $EXIT_CODE
        continue-on-error: true

      - name: GRACE Doxygen Check
        id: doxygen
        run: |
          chmod +x grace-tooling/grace-doxygen-check.py
          python3 grace-tooling/grace-doxygen-check.py src --root . --json > doxygen-report.json
          EXIT_CODE=$?
          echo "doxygen_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat doxygen-report.json
          exit $EXIT_CODE
        continue-on-error: true

      - name: Parse Results
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, sys

          has_errors = False

          # Parse lint results
          try:
              with open('lint-report.json') as f:
                  report = json.load(f)
              errors = report.get('by_severity', {}).get('error', 0)
              warnings = report.get('by_severity', {}).get('warning', 0)
              violations = report.get('violations', [])
              print(f"::notice title=GRACE Lint Report::Files: {report.get('files_scanned', 0)}, "
                    f"Violations: {errors} errors, {warnings} warnings")
              for v in violations:
                  sev = v.get('severity', 'warning')
                  ann = 'error' if sev == 'error' else 'warning'
                  print(f"::{ann} file={v.get('file','')},line={v.get('line',0)}::{v.get('issue','')}")
              if errors > 0:
                  has_errors = True
          except FileNotFoundError:
              print("::warning::Lint report not found")

          # Parse doxygen results
          try:
              with open('doxygen-report.json') as f:
                  report = json.load(f)
              files_scanned = report.get('files_scanned', 0)
              tags_checked = report.get('tags_checked', 0)
              total = report.get('total_violations', 0)
              errors = report.get('by_severity', {}).get('error', 0)
              warnings = report.get('by_severity', {}).get('warning', 0)
              print(f"::notice title=Doxygen Contract Check::Files: {files_scanned}, "
                    f"Tags: {tags_checked}, Violations: {total} ({errors} errors, {warnings} warnings)")
              for v in report.get('violations', []):
                  sev = v.get('severity', 'warning')
                  ann = 'error' if sev == 'error' else 'warning'
                  print(f"::{ann} file={v.get('file','')},line=0::{v.get('tag','')}: {v.get('issue','')}")
              if errors > 0:
                  has_errors = True
          except FileNotFoundError:
              print("::warning::Doxygen report not found")

          if has_errors:
              print("\n❌ GRACE checks failed. Merge blocked.")
              sys.exit(1)
          else:
              print("\n✅ All GRACE checks passed.")
          PYEOF
