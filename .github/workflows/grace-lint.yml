name: GRACE Phase-3 Lint

on:
  pull_request:
    branches:
      - main
      - develop
      - master
    paths:
      - 'src/**'
      - '.github/workflows/grace-lint.yml'

jobs:
  lint:
    name: GRACE Phase-3 Validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout grace-tooling
        uses: actions/checkout@v4
        with:
          repository: EvgheniAlexeev/grace-tooling
          path: grace-tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GRACE Phase-3 Lint
        id: lint
        run: |
          python3 grace-tooling/grace-lint-phase3.py src --output json --json-path lint-report.json
          EXIT_CODE=$?
          echo "lint_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat lint-report.json
          exit $EXIT_CODE
        continue-on-error: true

      - name: Parse Lint Results
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import sys

          try:
              with open('lint-report.json', 'r') as f:
                  report = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              print("::warning::Lint report not found or malformed")
              sys.exit(0)

          total = report.get('total_violations', 0)
          errors = report.get('by_severity', {}).get('error', 0)
          warnings = report.get('by_severity', {}).get('warning', 0)
          violations = report.get('violations', [])

          print(f"::notice title=GRACE Lint Report::Files: {report.get('files_scanned', 0)}, "
                f"Violations: {total} ({errors} errors, {warnings} warnings)")

          for v in violations:
              severity = v.get('severity', 'warning')
              file = v.get('file', '')
              line = v.get('line', 0)
              issue = v.get('issue', '')
              annotation = f"::error" if severity == 'error' else f"::warning"
              print(f"{annotation} file={file},line={line}::{issue}")

          if errors > 0:
              print(f"\n❌ GRACE Phase-3 validation failed: {errors} error(s). Merge blocked.")
              sys.exit(1)
          else:
              print(f"\n✅ GRACE Phase-3 validation passed. {warnings} warning(s) found.")
          PYEOF

      - name: Comment on PR
        if: failure() && steps.lint.outputs.lint_exit != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('lint-report.json', 'utf8'));
              const violations = report.violations || [];
              const errors = violations.filter(v => v.severity === 'error');
              const warnings = violations.filter(v => v.severity === 'warning');

              let body = `## ❌ GRACE Phase-3 Validation Failed\n\n`;
              body += `**Files scanned:** ${report.files_scanned || 0}\n`;
              body += `**Errors:** ${errors.length}\n`;
              body += `**Warnings:** ${warnings.length}\n\n`;

              if (errors.length > 0) {
                body += `### Errors\n`;
                errors.slice(0, 20).forEach(e => {
                  body += `- **\`${e.file}:${e.line}\`**: ${e.issue}\n`;
                });
                if (errors.length > 20) {
                  body += `- *... and ${errors.length - 20} more errors*\n`;
                }
                body += `\n`;
              }

              if (warnings.length > 0) {
                body += `### Warnings\n`;
                warnings.slice(0, 10).forEach(w => {
                  body += `- **\`${w.file}:${w.line}\`**: ${w.issue}\n`;
                });
                body += `\n`;
              }

              body += `---\n`;
              body += `To run locally: \`python3 grace-tooling/grace-lint-phase3.py src --output text\``;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              console.log('Could not parse lint report');
            }
